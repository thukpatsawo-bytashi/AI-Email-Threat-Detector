# Pyrefly configuration for AI Email Threat Detector

# Add backend so local packages resolve (database, analyzers, ml, alerts)
search_path = ["backend"]

# Exclude venv, build artifacts, and brain/scratch files from analysis
project_excludes = [
  "backend/venv/**",
  "**/.gemini/**",
]

# Suppress hover-snippet false positives from Pyrefly's in-memory evaluation
use_untyped_imports = true
